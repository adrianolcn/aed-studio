services:
  db:
    image: postgres:16-alpine
    container_name: aed-studio-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aedstudio}
      POSTGRES_USER: ${DATABASE_USER:-aedstudio}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-aedstudio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aed-studio-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-aedstudio} -d ${POSTGRES_DB:-aedstudio}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: aed-studio-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-aedstudio}
      DATABASE_USER: ${DATABASE_USER:-aedstudio}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-aedstudio}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-min-32-chars-change-in-prod}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_REFRESH_MS: ${JWT_REFRESH_MS:-604800000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500,http://localhost:8081}
      CORS_ORIGIN_PATTERNS: ${CORS_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*}
      CODE_SANDBOX_MODE: ${CODE_SANDBOX_MODE:-local}
      CODE_SANDBOX_TIMEOUT_SECONDS: ${CODE_SANDBOX_TIMEOUT_SECONDS:-2}
      CODE_SANDBOX_DOCKER_IMAGE: ${CODE_SANDBOX_DOCKER_IMAGE:-eclipse-temurin:17-jdk}
      CODE_SANDBOX_DOCKER_CPUS: ${CODE_SANDBOX_DOCKER_CPUS:-0.5}
      CODE_SANDBOX_DOCKER_MEMORY: ${CODE_SANDBOX_DOCKER_MEMORY:-128m}
      CODE_SANDBOX_DOCKER_PIDS_LIMIT: ${CODE_SANDBOX_DOCKER_PIDS_LIMIT:-64}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    container_name: aed-studio-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  aed-studio-db-data:
