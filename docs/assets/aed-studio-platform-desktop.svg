<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Tela inicial desktop do AED Studio</title>
  <desc id="desc">Representação da tela inicial desktop da plataforma, com sidebar, dashboard, mapa de progresso e próxima expedição.</desc>
  <rect width="1600" height="720" fill="#080d14"/>
  <rect x="0" y="0" width="1600" height="52" fill="#121821" stroke="#263241"/>
  <text x="24" y="34" font-family="IBM Plex Mono, Consolas, monospace" font-size="25" font-weight="700" fill="#64aaff">AED·Studio</text>
  <line x1="148" x2="148" y1="12" y2="42" stroke="#2b3442"/>
  <text x="172" y="33" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" fill="#a5adba">algoritmos / estrutura-de-dados / início</text>
  <rect x="1218" y="12" width="82" height="28" rx="14" fill="#102a18" stroke="#245b31"/>
  <text x="1259" y="31" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" fill="#57d36d">Java 17</text>
  <rect x="1314" y="12" width="162" height="28" rx="14" fill="#17142b" stroke="#463085"/>
  <text x="1395" y="31" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" fill="#c69bff">v2.0 · 20 tópicos</text>
  <rect x="1488" y="12" width="94" height="28" rx="14" fill="#202633" stroke="#384354"/>
  <text x="1535" y="31" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" fill="#b7c0cf">Sistema</text>

  <rect x="0" y="52" width="300" height="668" fill="#121821" stroke="#263241"/>
  <text x="24" y="104" font-family="IBM Plex Mono, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="3" fill="#7d8796">// MÓDULOS</text>
  <rect x="0" y="122" width="300" height="44" fill="#202a38"/>
  <rect x="0" y="122" width="3" height="44" fill="#5da8ff"/>
  <circle cx="24" cy="144" r="5" fill="#5da8ff"/>
  <text x="48" y="150" font-family="Inter, Arial, sans-serif" font-size="18" fill="#edf3fb">Início</text>
  <g font-family="Inter, Arial, sans-serif" font-size="18" fill="#9aa5b5">
    <circle cx="24" cy="198" r="5" fill="#7b8494"/><text x="48" y="204">Fundamentos</text><text x="270" y="204" fill="#7b8494">▶</text>
    <circle cx="24" cy="242" r="5" fill="#7b8494"/><text x="48" y="248">Estruturas Lineares</text><text x="270" y="248" fill="#7b8494">▶</text>
    <circle cx="24" cy="286" r="5" fill="#7b8494"/><text x="48" y="292">Estruturas Não-Lineares</text><text x="270" y="292" fill="#7b8494">▶</text>
    <circle cx="24" cy="330" r="5" fill="#7b8494"/><text x="48" y="336">Algoritmos de Ordenação</text><text x="270" y="336" fill="#7b8494">▶</text>
    <circle cx="24" cy="374" r="5" fill="#7b8494"/><text x="48" y="380">Algoritmos em Grafos</text><text x="270" y="380" fill="#7b8494">▶</text>
    <circle cx="24" cy="418" r="5" fill="#7b8494"/><text x="48" y="424">Paradigmas</text><text x="270" y="424" fill="#7b8494">▶</text>
  </g>
  <line x1="0" x2="300" y1="548" y2="548" stroke="#263241"/>
  <text x="28" y="592" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" fill="#fbbf24">0 dias seguidos</text>
  <text x="28" y="618" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" fill="#8b95a5">estude hoje para manter</text>
  <text x="24" y="654" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" fill="#8b95a5">PROGRESSO // 0%</text>
  <rect x="24" y="674" width="256" height="5" rx="3" fill="#303a48"/>

  <rect x="300" y="52" width="1300" height="668" fill="#090e15"/>
  <rect x="360" y="96" width="1170" height="46" rx="23" fill="#1b2430" stroke="#2b3442"/>
  <text x="382" y="124" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" letter-spacing="5" fill="#7b8494">// LEGENDA DE SÍMBOLOS E CONVENÇÕES</text>
  <text x="360" y="190" font-family="IBM Plex Mono, Consolas, monospace" font-size="18" letter-spacing="6" fill="#5da8ff">// BASE DO EXPLORADOR — MAPA DO CONHECIMENTO</text>
  <text x="360" y="258" font-family="Inter, Arial, sans-serif" font-size="48" fill="#e8edf5">Algoritmos &amp;</text>
  <text x="360" y="318" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700" fill="#5da8ff">Estrutura de Dados</text>
  <text x="360" y="374" font-family="Inter, Arial, sans-serif" font-size="20" fill="#9aa5b5">20 tópicos · avanço por trilhas, clareiras e territórios desbloqueados · com simuladores interativos,</text>
  <text x="360" y="410" font-family="Inter, Arial, sans-serif" font-size="20" fill="#9aa5b5">exercícios dinâmicos, código Java anotado e recomendações guiadas por dados reais.</text>

  <rect x="360" y="480" width="638" height="170" rx="8" fill="#121821" stroke="#2b3442"/>
  <text x="384" y="520" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" letter-spacing="4" fill="#5da8ff">// MAPA DE PROGRESSO</text>
  <g font-family="IBM Plex Mono, Consolas, monospace">
    <rect x="384" y="548" width="145" height="82" rx="7" fill="#1b2430" stroke="#303a48"/><text x="400" y="576" font-size="13" fill="#7b8494">TERRITÓRIO</text><text x="400" y="612" font-size="28" font-weight="700" fill="#d7dde7">0%</text>
    <rect x="546" y="548" width="145" height="82" rx="7" fill="#1b2430" stroke="#303a48"/><text x="562" y="576" font-size="13" fill="#7b8494">XP</text><text x="562" y="612" font-size="28" font-weight="700" fill="#d7dde7">0</text>
    <rect x="708" y="548" width="145" height="82" rx="7" fill="#1b2430" stroke="#303a48"/><text x="724" y="576" font-size="13" fill="#7b8494">NÍVEL</text><text x="724" y="612" font-size="28" font-weight="700" fill="#d7dde7">1</text>
    <rect x="870" y="548" width="105" height="82" rx="7" fill="#1b2430" stroke="#303a48"/><text x="886" y="576" font-size="13" fill="#7b8494">STREAK</text><text x="886" y="612" font-size="28" font-weight="700" fill="#d7dde7">0</text>
  </g>
  <rect x="1018" y="480" width="512" height="170" rx="8" fill="#121821" stroke="#2b3442"/>
  <text x="1042" y="520" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" letter-spacing="4" fill="#49d86d">// PRÓXIMA EXPEDIÇÃO</text>
  <rect x="1042" y="548" width="440" height="66" rx="8" fill="#163125"/>
  <text x="1062" y="588" font-family="Inter, Arial, sans-serif" font-size="18" fill="#8fa09b">Carregando recomendação principal...</text>
  <text x="1042" y="640" font-family="Inter, Arial, sans-serif" font-size="16" fill="#8b95a5">Carregando próximos passos...</text>
  <rect x="0" y="686" width="1600" height="34" fill="#378cef"/>
  <text x="18" y="708" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" fill="#edf7ff">• AED·Studio</text>
  <text x="1320" y="708" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" fill="#edf7ff">v2.0 · jornada do explorador</text>
</svg>
