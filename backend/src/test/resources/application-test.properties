# Perfil de teste — H2 em memória, sem Flyway, sem PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
jwt.secret=test-secret-key-min-32-characters-ok
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=86400000
cors.allowed-origins=http://localhost:5500
cors.allowed-origin-patterns=http://localhost:*
code.sandbox.mode=local
code.sandbox.timeout-seconds=2
