# Perfil E2E: usado pelo Playwright e CI para subir a API sem PostgreSQL externo.
spring.datasource.url=jdbc:h2:mem:aedstudio-e2e;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

jwt.secret=e2e-secret-key-min-32-characters-ok
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=86400000

cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500
cors.allowed-origin-patterns=http://127.0.0.1:*,http://localhost:*

code.sandbox.mode=local
code.sandbox.timeout-seconds=2
