# ═══════════════════════════════════════════════════════
#  AED·Studio — application.properties
#  Perfil padrão: lê variáveis de ambiente.
#  Para dev local: copie .env.example para .env e exporte.
# ═══════════════════════════════════════════════════════

spring.application.name=aed-studio
server.port=${PORT:8080}

# ── DataSource — PostgreSQL ──────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/aedstudio}
spring.datasource.username=${DATABASE_USER:aedstudio}
spring.datasource.password=${DATABASE_PASSWORD:aedstudio}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP (connection pool) ───────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ──────────────────────────────────
# validate: Flyway gerencia o schema — Hibernate só verifica
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway — migrations versionadas ─────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── Spring Session JDBC ──────────────────────────────
# Armazena sessões web no PostgreSQL (tabela SPRING_SESSION)
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=1800

# ── JWT ──────────────────────────────────────────────
jwt.secret=${JWT_SECRET:dev-secret-min-32-chars-change-in-prod}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_MS:604800000}

# ── CORS ─────────────────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}

# ── Logging ──────────────────────────────────────────
logging.level.com.aedstudio=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
