# ═══════════════════════════════════════════════════════
#  AED·Studio — application.properties
#  Perfil padrão: lê variáveis de ambiente.
#  Para dev local: copie .env.example para .env e exporte.
# ═══════════════════════════════════════════════════════

spring.application.name=aed-studio
server.port=${PORT:8080}

# ── DataSource — PostgreSQL ──────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/aedstudio}
spring.datasource.username=${DATABASE_USER:aedstudio}
spring.datasource.password=${DATABASE_PASSWORD:aedstudio}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP (connection pool) ───────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ──────────────────────────────────
# validate: Flyway gerencia o schema — Hibernate só verifica
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── Flyway — migrations versionadas ─────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── JWT ──────────────────────────────────────────────
jwt.secret=${JWT_SECRET:dev-secret-min-32-chars-change-in-prod}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_MS:604800000}

# ── Actuator / Health ────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ── CORS ─────────────────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}
cors.allowed-origin-patterns=${CORS_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.16.*.*:*,http://172.17.*.*:*,http://172.18.*.*:*,http://172.19.*.*:*,http://172.20.*.*:*,http://172.21.*.*:*,http://172.22.*.*:*,http://172.23.*.*:*,http://172.24.*.*:*,http://172.25.*.*:*,http://172.26.*.*:*,http://172.27.*.*:*,http://172.28.*.*:*,http://172.29.*.*:*,http://172.30.*.*:*,http://172.31.*.*:*}

# ── Logging ──────────────────────────────────────────
logging.level.com.aedstudio=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# ── Code sandbox ─────────────────────────────────────
# local: dev/test fallback. docker: recommended for production/public use.
code.sandbox.mode=${CODE_SANDBOX_MODE:local}
code.sandbox.timeout-seconds=${CODE_SANDBOX_TIMEOUT_SECONDS:2}
code.sandbox.docker-image=${CODE_SANDBOX_DOCKER_IMAGE:eclipse-temurin:17-jdk}
code.sandbox.docker-cpus=${CODE_SANDBOX_DOCKER_CPUS:0.5}
code.sandbox.docker-memory=${CODE_SANDBOX_DOCKER_MEMORY:128m}
code.sandbox.docker-pids-limit=${CODE_SANDBOX_DOCKER_PIDS_LIMIT:64}
