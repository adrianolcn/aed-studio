name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Prepare Maven wrapper on Unix
        if: runner.os != 'Windows'
        run: chmod +x mvnw
      - name: Test backend on Unix
        if: runner.os != 'Windows'
        run: ./mvnw test
      - name: Test backend on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd test

  frontend:
    name: frontend / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test frontend contracts
        run: npm run test:frontend:contracts
      - name: Visual smoke test
        if: runner.os == 'Linux'
        run: npm run test:frontend:visual

  e2e:
    name: e2e / playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare Maven wrapper
        run: chmod +x backend/mvnw
      - name: Install frontend test dependencies
        run: npm install
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E browser flow
        env:
          CODE_SANDBOX_MODE: local
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
